name: manual-build

on:  
  workflow_dispatch:
    inputs:
      GIT_BRANCH:
        description: 'branch to clone'     
        required: true
        default: 'main'
      ENVIRONMENT:
        description: 'deploy to'     
        required: true
        default: 'mytype-dev'
      OPERATION:
        type: choice
        description: 'action to perform (full=test & deploy on dev, deploy=build & deploy, upgrade=in place upgrade)'
        required: true
        default: 'full'
        options: 
          - full
          - deploy
          - upgrade

run-name: >
  manual-build · ${{ github.event.inputs.GIT_BRANCH }}

jobs:
  main:
    runs-on: ubuntu-latest
    env: # all these values are stored in the .env file used by the upgrade process
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      LOGTAIL_AUTH_TOKEN: ${{ secrets.LOGTAIL_AUTH_TOKEN }}
      CONVOX_TOKEN: ${{ secrets.CONVOX_TOKEN }}
      GH_REPO_OWNER: ${{ github.repository_owner }} 
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
      DEFAULT_AWS_ACCESS_KEY_ID: ${{ secrets.DEFAULT_AWS_ACCESS_KEY_ID }}
      DEFAULT_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEFAULT_AWS_SECRET_ACCESS_KEY }}
      
    steps:
      - name: checkout
        run: |
          pwd
          git config --global http.sslverify false
          git clone --branch "${{ github.event.inputs.GIT_BRANCH}}" "https://${{ github.repository_owner }}:${{ secrets.GH_PASSWORD }}@github.com/atex-products/mytype-for-wordpress.git" .
          ls -la

      - name: Resolve git tree
        id: tree
        run: |
          echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The mt4wp commit shows this build (tests, sonar gate, deploy) as its `manual-build` check.
      - name: Report the build as pending on the commit
        if: github.event.inputs.OPERATION == 'full'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PASSWORD }}
        run: |
          gh api "repos/atex-products/mytype-for-wordpress/statuses/${{ steps.tree.outputs.sha }}" \
            -f state=pending -f context=manual-build -f description="build running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # sonar-scan-with-coverage saves this marker after a passing scan of a tree
      - name: Look up a passing sonar scan of this tree
        id: sonar-passed
        uses: actions/cache/restore@v5
        with:
          path: .sonar-passed
          key: sonar-passed-${{ steps.tree.outputs.hash }}
          lookup-only: true

      # Started before this job's own setup: the scan is the longest leg of a branch build.
      - name: Start the sonar scan
        id: sonar-scan
        if: github.event.inputs.OPERATION == 'full' && steps.sonar-passed.outputs.cache-hit != 'true'
        env:
          GIT_BRANCH: ${{ github.event.inputs.GIT_BRANCH }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
        run: |
          ./shared/build/scripts/sonarqube/execute-scan.sh sonar-scan-with-coverage.yml
          echo "run-id=$(cat sonar_run_id.txt)" >> "$GITHUB_OUTPUT"
          rm sonar_run_id.txt

      # .nvmrc is the source of truth for the Node version, floored at the oldest Node
      # LTS we are willing to build on. Branches predating the Node 24 standardisation
      # still declare v20, whose last release was 2026-03-24 and which no longer gets
      # security patches - honouring that literally would DOWNGRADE them from the v22
      # they build on today. This floor is policy, not a stopgap: we never build on an
      # end-of-life Node. Raise MIN_NODE when the floor itself reaches EOL (22: ~2027-04).
      - name: Resolve Node version
        id: node-version
        run: |
          MIN_NODE=22
          want=$(tr -dc '0-9.' < .nvmrc 2>/dev/null || true)
          major=${want%%.*}
          case "$major" in
            ''|*[!0-9]*) resolved=$MIN_NODE ;;
            *) if [ "$major" -lt "$MIN_NODE" ]; then resolved=$MIN_NODE; else resolved=$want; fi ;;
          esac
          echo "resolved Node $resolved (.nvmrc requested '${want:-none}', floor $MIN_NODE)"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        name: Install node
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Restore cached pnpm dependencies
        id: cache-dependencies-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Install zx globally and add to PATH
        run: |
          # pnpm 11 keeps global binaries in $PNPM_HOME/bin and refuses to install there
          # unless that directory is already on PATH, so it is created and exported first.
          # `pnpm config get global-bin-dir` cannot be used for this any more: it prints
          # "undefined" on pnpm 11.
          PNPM_GLOBAL_BIN="${PNPM_HOME:-$HOME/.local/share/pnpm}/bin"
          mkdir -p "$PNPM_GLOBAL_BIN"
          export PATH="$PNPM_GLOBAL_BIN:$PATH"
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH

          # Install zx globally if not already installed
          if ! command -v zx &> /dev/null; then
            echo "Installing zx globally..."
            pnpm install -g zx@^8.8.5
          fi
          echo "zx is available at: $(which zx)"
          
      - name: Install dependencies
        run: pnpm install
      - name: Cache pnpm dependencies
        id: cache-dependencies-save
        if: steps.cache-dependencies-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: nrwl/nx-set-shas@v5
      
      - name: Get Current Job Log URL
        id: jobs
        run: |
          JOBS_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          JOB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_PASSWORD }}" "$JOBS_URL" | jq -r '.jobs[] | select(.name == "${{ github.job }}") | .html_url')
          echo "html_url=$JOB_URL" >> $GITHUB_OUTPUT

      - name: ensure aws cli is present
        run: |
          aws --version

      - name: authenticate aws cli
        run: |
          aws configure set aws_access_key_id "${{ secrets.DEFAULT_AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.DEFAULT_AWS_SECRET_ACCESS_KEY}}"
      
      # export any variables needed for the build script before running it
      - name: BUILD
        env:
          SONAR_ALREADY_PASSED: ${{ steps.sonar-passed.outputs.cache-hit }}
          SONAR_RUN_ID: ${{ steps.sonar-scan.outputs.run-id }}
        run: |
          export GH_PASSWORD="${{ secrets.GH_PASSWORD }}"
          export DEFAULT_AWS_ACCESS_KEY_ID="${{ secrets.DEFAULT_AWS_ACCESS_KEY_ID }}"
          export DEFAULT_AWS_SECRET_ACCESS_KEY="${{ secrets.DEFAULT_AWS_SECRET_ACCESS_KEY }}"
          ./shared/build/boot.sh "${{ github.event.inputs.GIT_BRANCH}}" "${{ steps.jobs.outputs.html_url }}" "${{ github.event.inputs.ENVIRONMENT }}" "${{ secrets.SALT }}" "${{ github.event.inputs.OPERATION }}"

      - name: Report the build result on the commit
        if: always() && github.event.inputs.OPERATION == 'full' && steps.tree.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PASSWORD }}
        run: |
          state=$([ "${{ job.status }}" = success ] && echo success || echo failure)
          gh api "repos/atex-products/mytype-for-wordpress/statuses/${{ steps.tree.outputs.sha }}" \
            -f state="$state" -f context=manual-build -f description="build ${{ job.status }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
